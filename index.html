<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="家庭晨間儀表板 — 天氣、穿衣、空氣質素、98A 巴士">
  <title>家庭晨間儀表板</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="dashboard">
    <header class="header">
      <h1 class="greeting" id="greeting">早安</h1>
      <div class="datetime">
        <div class="time" id="time">--:--</div>
        <div id="date">----</div>
      </div>
    </header>

    <main>
      <section class="info-bar card" id="info-bar">
        <div class="info-item" id="weather-card">
          <div class="info-icon" id="weather-icon">🌤️</div>
          <div class="info-body">
            <span class="info-value" id="temperature">--°C</span>
            <span class="info-label" id="weather-place">香港</span>
          </div>
        </div>

        <div class="info-divider" aria-hidden="true"></div>

        <div class="info-item">
          <span class="info-emoji">💧</span>
          <div class="info-body">
            <span class="info-value" id="humidity">--</span>
            <span class="info-label">濕度</span>
          </div>
        </div>

        <div class="info-divider" aria-hidden="true"></div>

        <div class="info-item" id="aqi-card">
          <span class="info-emoji">🌫️</span>
          <div class="info-body">
            <span class="info-value" id="aqi-value">--</span>
            <span class="info-label" id="aqi-label">空氣質素</span>
          </div>
        </div>

        <div class="info-divider" aria-hidden="true"></div>

        <div class="info-item">
          <span class="info-emoji" id="dress-icon">👕</span>
          <div class="info-body">
            <span class="info-value" id="dress-level">--</span>
            <span class="info-label" id="dress-advice">穿衣</span>
          </div>
        </div>
      </section>

      <section class="bus-hero card" id="bus-card">
        <div class="bus-hero-top">
          <div class="bus-badge">
            <span class="bus-route" id="bus-route">98A</span>
          </div>
          <div class="bus-meta">
            <div class="bus-direction" id="bus-direction">→ 牛頭角方向</div>
            <div class="bus-stop-name" id="bus-stop">--</div>
          </div>
        </div>
        <div class="eta-list" id="eta-list">
          <div class="eta-item">
            <div class="eta-minutes">--<span class="unit">分</span></div>
            <div class="eta-time">載入中</div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p id="last-updated">最後更新：--</p>
    </footer>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
